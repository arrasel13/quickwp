[package]
name = "nexora-edge"
version = "0.1.0"
edition = "2021"
description = "Nexora's privileged edge: terminates TLS on 443 and forwards. Nothing else."

# This binary runs as root, so its dependency surface is kept as small as the
# job allows: TLS and PEM parsing, and nothing that touches the network, a
# database, or the user's files beyond the certificates it serves.
[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
