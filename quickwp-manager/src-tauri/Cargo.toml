[package]
name = "nexora-app"
version = "0.1.0"
description = "Nexora"
authors = ["Nexora"]
edition = "2021"

[workspace]
members = ["core", "edge", "cli"]

[lib]
name = "nexora_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
nexora-core = { path = "core" }
# "unstable": child webviews, for the live site preview beside its details.
# "macos-private-api": a see-through webview, for the menus that open over it
# (src/overlay.rs). It keeps an app out of the Mac App Store; Nexora ships as a
# .dmg. Must match `app.macOSPrivateApi` in tauri.conf.json.
tauri = { version = "2.0", features = ["unstable", "macos-private-api"] }
tauri-plugin-opener = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
