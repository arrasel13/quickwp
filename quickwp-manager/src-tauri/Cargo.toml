[package]
name = "nexora-app"
version = "0.1.0"
description = "Nexora"
authors = ["Nexora"]
edition = "2021"

[workspace]
members = ["core", "edge", "cli"]

[lib]
name = "nexora_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
nexora-core = { path = "core" }
# "unstable": child webviews, for the live site preview beside its details.
# "macos-private-api": a see-through webview, for the menus that open over it
# (src/overlay.rs). It keeps an app out of the Mac App Store; Nexora ships as a
# .dmg. Must match `app.macOSPrivateApi` in tauri.conf.json.
tauri = { version = "2.0", features = ["unstable", "macos-private-api"] }
tauri-plugin-opener = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
base64 = "0.22"

# Drawing a loaded page into a picture is WebKit's job, and only its own
# API can ask (src/thumb.rs). Versions follow the ones wry already builds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["std", "NSData", "NSDictionary", "NSError", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }
