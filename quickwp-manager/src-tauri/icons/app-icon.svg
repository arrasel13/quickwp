<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Nexora app icon: the N ribbon on a dark tile, inside the macOS icon
       grid (824px tile, 100px margin). `npx tauri icon` renders every
       platform size from this file. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141833"/>
      <stop offset="1" stop-color="#07081A"/>
    </linearGradient>
    <linearGradient id="nx-band" x1="18" y1="18" x2="82" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1ED2FA"/>
      <stop offset="0.5" stop-color="#3452FF"/>
      <stop offset="1" stop-color="#A23CF6"/>
    </linearGradient>
    <linearGradient id="nx-left" x1="0" y1="36" x2="0" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B2FD6"/>
      <stop offset="1" stop-color="#1FB8FF"/>
    </linearGradient>
    <linearGradient id="nx-right" x1="0" y1="37" x2="0" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8E45F7"/>
      <stop offset="1" stop-color="#4E26D9"/>
    </linearGradient>
    <linearGradient id="nx-flag" x1="66" y1="15" x2="84" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B040F7"/>
      <stop offset="1" stop-color="#7B3AF2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <g transform="translate(512 505) scale(7.2) translate(-51 -50)" filter="url(#glow)">
    <path d="M18 36 V86 L36 74 V36 Z" fill="url(#nx-left)"/>
    <path d="M64 38 L82 50 V71 H64 Z" fill="url(#nx-right)"/>
    <line x1="27" y1="27" x2="73" y2="71" stroke="url(#nx-band)" stroke-width="18" stroke-linecap="round"/>
    <path d="M66 15.5 L84 24.8 L66 34 Z" fill="url(#nx-flag)" stroke="url(#nx-flag)" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
