[package]
name = "nexora-cli"
version = "0.1.0"
edition = "2021"
description = "The `nexora` command-line interface."

[[bin]]
name = "nexora"
path = "src/main.rs"

[dependencies]
nexora-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
