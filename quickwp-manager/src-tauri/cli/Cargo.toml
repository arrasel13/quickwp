[package]
name = "quickwp-cli"
version = "0.1.0"
edition = "2021"
description = "The `quickwp` command-line interface."

[[bin]]
name = "quickwp"
path = "src/main.rs"

[dependencies]
quickwp-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
